const contrast = (el) => {
  const css = getComputedStyle(el);
  let background = css.backgroundColor;
  let parent = el.parentElement;
  while (/rgba\([^)]*,\s*0\)$/.test(background) && parent) {
    background = getComputedStyle(parent).backgroundColor;
    parent = parent.parentElement;
  }
  const lum = (color) => {
    const rgb = color.match(/[\d.]+/g).slice(0, 3).map((v) => {
      const x = Number(v) / 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4;
    });
    return rgb[0] * .2126 + rgb[1] * .7152 + rgb[2] * .0722;
  };
  const colors = [lum(css.color), lum(background)].sort((a, b) => a - b);
  return (colors[1] + .05) / (colors[0] + .05);
};

await test('B2: metric boxes stay in one row with stable widths and ellipsis', async () => {
  const box = document.querySelector('.metrics');
  for (let i = 0; i < 100 && !box.children.length; i++) await sleep();
  assert(box.children.length > 0, 'metric refresh did not complete');
  if (!visible(box)) {
    assert(visible(document.querySelector('.metrics-toggle')), 'narrow screen has no metrics toggle');
    return;
  }
  const chips = [...box.children];
  const brand = document.querySelector('.brand').getBoundingClientRect();
  const rect = box.getBoundingClientRect();
  assert(!visible(document.querySelector('.metrics-toggle')), 'compact toggle is visible on desktop');
  assert(Math.abs(rect.y + rect.height / 2 - brand.y - brand.height / 2) < 2, 'metrics left the reserved desktop header row');
  const before = chips.map((el) => el.getBoundingClientRect());
  chips.forEach((el) => {
    const value = el.querySelector('.chip-value');
    if (value) value.textContent = 'Very long changing metric value '.repeat(8);
  });
  const after = chips.map((el) => el.getBoundingClientRect());
  assert(after.every((rect) => Math.abs(rect.y - after[0].y) < 1), 'metric boxes wrapped');
  assert(after.every((rect, i) => Math.abs(rect.width - before[i].width) < 1), 'metric widths changed with values');
  const value = chips[0].querySelector('.chip-value');
  assert(getComputedStyle(value).textOverflow === 'ellipsis' && value.scrollWidth > value.clientWidth, 'long values are not ellipsized');
});

async function interactiveFixture(run, signedOut = false, query = '') {

    app.state.boot.security_banner = { last: { ts: '2026-11-24T20:00:00Z', ip: '127.0.0.1' }, failed: 2,
      since: '2026-11-24T20:00:00Z', until: '2026-11-25T20:00:00Z' };
    window.dispatchEvent(new CustomEvent('po:password-changed')); await sleep(); await sleep();
    const banner = document.querySelector('#app > .notice .banner-close').parentElement;
    for (const hash of ['#/jobs', '#/metadata', '#/home']) {
      await go(hash);
      assert(banner.isConnected && banner.querySelector('a').textContent === t('security.review'), 'sign-in banner disappeared or Review label wrong');
    }
    banner.querySelector('.banner-close').click(); await sleep();
    assert(!banner.isConnected && app.state.boot.security_banner.dismissed, 'banner dismissal not retained');
    window.dispatchEvent(new CustomEvent('po:password-changed')); await sleep(); await sleep();
    assert(!document.querySelector('.banner-close'), 'dismissed banner returned after shell rebuild');
  } finally { app.state.boot.security_banner = previous; window.dispatchEvent(new CustomEvent('po:password-changed')); await sleep(); await go('#/home'); }
});
await test('UI polish: timezone suggestions start UTC and preview buttons have a real gap', async () => {
  await go('#/admin/settings');
  document.querySelector('.combobox .combo-trigger').click();
  const suggestions = [...document.querySelectorAll('.combo-list [role="option"]')];

  document.querySelector('.combo-search input').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await go('#/logs');

  emptyLogs = true;
  await go('#/logs?job_id=99');

  emptyLogs = false; await go('#/home');
});
await test('UI polish: sign-in ignores a second submit while the first is in flight', async () => {
  const { renderLogin } = await import('../frontend/static/js/views/login.js');
  const root = document.createElement('div');
  document.body.appendChild(root);
  let submitted = 0, release;
  const original = window.fetch;
  window.fetch = async (url, opts) => {
    if (url === '/api/login') { submitted++; await new Promise((resolve) => { release = resolve; }); return new Response('{}'); }
    return original(url, opts);
  };
  try {
    renderLogin(root, app.state, async () => {});
    const form = root.querySelector('form');
    form.querySelector('[type="text"]').value = 'synthetic';
    form.querySelector('[type="password"]').value = 'synthetic-only';
    form.dispatchEvent(new Event('submit', { cancelable: true }));
    form.dispatchEvent(new Event('submit', { cancelable: true }));
    assert(submitted === 1 && form.querySelector('[type="submit"]').disabled, 'double submit was accepted');
    release(); await sleep();
  } finally { window.fetch = original; root.remove(); await go('#/home'); }
});
if (app.state.view?.destroy) app.state.view.destroy();
if (app.state.stopMetrics) app.state.stopMetrics();
}
