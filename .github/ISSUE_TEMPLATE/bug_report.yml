name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (English event codes)
      description: "docker compose logs app. NEVER paste your .env, keys, passwords or the setup token."
      render: text
  - type: input
    id: version
    attributes:
      label: Application version (header) and database type
