name: New language
description: Propose (or volunteer for) a new translation
title: "[i18n] New language: "
labels: ["i18n", "new language"]
body:
  - type: input
    id: code
    attributes:
      label: Language code (BCP 47)
      placeholder: "nl, pt-PT, zh-Hant, sr-Latn"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Language name in the language itself
      placeholder: "Nederlands"
    validations:
      required: true
  - type: dropdown
    id: dir
    attributes:
      label: Writing direction
      options: ["ltr", "rtl"]
    validations:
      required: true
  - type: checkboxes
    id: who
    attributes:
      label: Contribution
      options:
        - label: I am a native speaker
        - label: I will open a pull request with the translation (see CONTRIBUTING.md)
  - type: textarea
    id: notes
    attributes:
      label: Notes (plural rules, terminology questions…)
