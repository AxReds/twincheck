name: Release image

# Builds the container image for linux/amd64 and linux/arm64 and publishes it to
# the GitHub Container Registry (ghcr.io/<owner>/twincheck) when a version tag
# such as v1.0.0 is pushed. Pre-releases publish only their exact version and rc.
# It can also be started by hand from the Actions tab
# (Run workflow) to publish an "edge" image of the current main branch.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, smoke-test and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Image name and version
        id: v
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:$version,ghcr.io/${GITHUB_REPOSITORY,,}:rc" >> "$GITHUB_OUTPUT"
            elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              minor="${version%.*}"
              echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:$version,ghcr.io/${GITHUB_REPOSITORY,,}:$minor,ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Invalid version tag"
              exit 1
            fi
          else
            echo "version=0.0.0-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Version tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python3 -c "import re,pathlib; print(re.search(r'VERSION = \"([^\"]+)\"', pathlib.Path('app/backend/twincheck/__init__.py').read_text()).group(1))")
          test "$app" = "${{ steps.v.outputs.version }}" || { echo "::error::tag v${{ steps.v.outputs.version }} but app VERSION is $app"; exit 1; }

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test (amd64, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: twincheck:smoke
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (hardened run, healthz on port 80)
        run: |
          key=$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
                  --tmpfs /tmp twincheck:smoke generate-key | sed -n 's/^APP_MASTER_KEY=//p' | head -n1)
          test -n "$key"
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/state"
          docker run -d --name smoke --user "$(id -u):$(id -g)" --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777 \
            -e APP_MASTER_KEY="$key" -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/state:/state" \
            -p 127.0.0.1:7777:80 twincheck:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7777/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:7777/healthz
          test "$(docker exec smoke awk '/^Uid:/{print $2}' /proc/1/status)" != "0"
          docker rm -f smoke

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
