name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check locale files and hard-coded UI text
        run: python3 -B app/tools/check_locales.py

  tests:
    name: Tests (SQLite + MariaDB)
    runs-on: ubuntu-24.04
    needs: translations
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          python3 -m pip install -r docker/requirements.txt "cryptography>=42"
      - name: Unit and integration tests
        env:
          TWINCHECK_TEST_MARIADB_HOST: 127.0.0.1
          TWINCHECK_TEST_MARIADB_PASSWORD: test-only-password
          TWINCHECK_BIG_ROWS: "300000"
        run: python3 -B -m unittest discover -s app/tests -v

  docker:
    name: Container image and acceptance tests
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Container acceptance tests
        env:
          TWINCHECK_BIG_ROWS: "1000000"
        run: bash docker/tests/run_container_tests.sh
