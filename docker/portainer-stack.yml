# TwinCheck - stack for Portainer (Stacks -> Add stack -> Web editor), or for
# "docker compose -f portainer-stack.yml up -d" on any Docker host.
# Uses the published image instead of building it. Set the variables in
# Portainer's "Environment variables" section (see docker/README.md, "Portainer").
# Keep it in sync with docker-compose.yml: a test checks that both files pass the
# same parameters and the same hardening options.
name: twincheck

services:
  app:
    image: ghcr.io/axreds/twincheck:${APP_VERSION:-1.0.0}
    container_name: ${CONTAINER_NAME:-twincheck}
    restart: unless-stopped
    # non-root from the very first process; no privilege changes at runtime
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:7777:80"
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY missing - generate it with docker run --rm ghcr.io/axreds/twincheck generate-key}
      APP_MASTER_KEY_FILE: ${APP_MASTER_KEY_FILE:-}
      APP_LANG: ${APP_LANG:-en}
      TZ: ${TZ:-}
      HOST_LABEL: ${HOST_LABEL:-}
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DISK_WARN_FREE_PERCENT: ${DISK_WARN_FREE_PERCENT:-15}
      DISK_CRIT_FREE_PERCENT: ${DISK_CRIT_FREE_PERCENT:-5}
      MAX_REQUEST_KB: ${MAX_REQUEST_KB:-1024}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-102400}
      MARIADB_PASSWORD_FILE: ${MARIADB_PASSWORD_FILE:-}
      JOB_WORKERS: ${JOB_WORKERS:-2}
      PREVIEW_CACHE_MAX_MB: ${PREVIEW_CACHE_MAX_MB:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # absolute host paths, owned by PUID:PGID
      - ${DATA_PATH:?DATA_PATH missing - absolute host path of the photo library}:/data
      - ${STATE_PATH:?STATE_PATH missing - absolute host path for the state folder}:/state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMP_SIZE:-512m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # the only accommodation for port 80: affects the container's network namespace only
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: ["CMD", "twincheck-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 60s
