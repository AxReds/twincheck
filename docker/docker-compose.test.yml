# Test-only MariaDB used by the test-suite (never for production data).
#   docker compose -f docker/docker-compose.test.yml up -d
#   PHOTOORG_TEST_MARIADB_HOST=127.0.0.1 PHOTOORG_TEST_MARIADB_PORT=33306 \
#   PHOTOORG_TEST_MARIADB_PASSWORD=test-only-password python3 -m unittest discover -s app/tests
name: twincheck-test
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:33306:3306"
    command: ["--max-allowed-packet=64M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    tmpfs:
      - /var/lib/mysql
